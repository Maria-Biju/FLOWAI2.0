
<!DOCTYPE html>
<html>
<head>
    <title>FLOWAI Chatbot</title>
    <style>
       /* ===== GLOBAL ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg,#0f172a,#020617);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px 0;
    overflow-y:auto;
    color:white;
}

/* ===== MAIN CONTAINER ===== */
.container{
    width:600px;
    max-height:90vh;
    overflow-y:auto;
    padding: 0 20px;
}

/* ===== TITLE ===== */
h2{
    margin-bottom:15px;
    font-weight:600;
    letter-spacing:1px;
    color:#e2e8f0;
}

h3{
    font-size:16px;
    font-weight:600;
    color:#e2e8f0;
}

/* ===== CHATBOX ===== */
#chatbox{
    height:350px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:0 10px 35px rgba(0,0,0,0.6);
}

/* scrollbar */
#chatbox::-webkit-scrollbar{
    width:0;
    display:none;
}
#chatbox::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}
#chatbox {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

/* ===== MESSAGES ===== */
.user,.bot{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.4;
    animation:fadeIn .2s ease-in;
}

/* user bubble */
.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    border-bottom-right-radius:4px;
}

/* bot bubble */
.bot{
    align-self:flex-start;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
    color:#e2e8f0;
    border-bottom-left-radius:4px;
}

/* ===== INPUT AREA ===== */
.input-area{
    margin-top:12px;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px 14px;
    border-radius:14px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:14px;
}

input::placeholder{
    color:#94a3b8;
}

/* ===== BUTTON ===== */
button{
    padding:12px 18px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(34,197,94,0.4);
}

button:active{
    transform:scale(0.96);
}
.small-btn {
    padding:10px 14px;
    border-radius:12px;
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    font-size:13px;
}
.schedule-panel {
    margin-top:20px;
    margin-bottom:30px;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:18px;
    max-height:300px;
    overflow-y:auto;
}
.schedule-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    position:sticky;
    top:0;
    background: rgba(255,255,255,0.06);
    padding-bottom:10px;
}
.schedule-list {
    display:flex;
    flex-direction:column;
    gap:12px;
}
.schedule-item {
    padding:14px;
    border-radius:16px;
    background:rgba(15,23,42,0.8);
    border:1px solid rgba(148,163,184,0.15);
}
.schedule-item p {
    margin-bottom:8px;
    font-size:13px;
    color:#cbd5e1;
}
.schedule-item button {
    background:linear-gradient(135deg,#ef4444,#dc2626);
    font-size:12px;
    padding:8px 12px;
}
/* ===== LOGOUT BUTTON TOP RIGHT ===== */
.logout-btn{
    position:absolute;
    top:20px;
    right:30px;
    padding:8px 14px;
    border-radius:10px;
    background:linear-gradient(135deg,#ef4444,#dc2626);
    color:white;
    font-size:14px;
    text-decoration:none;
    font-weight:500;
    box-shadow:0 4px 12px rgba(239,68,68,0.4);
    transition:0.2s;
}

.logout-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(239,68,68,0.6);
}


/* ===== ANIMATION ===== */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
}

    </style>
</head>
<body>

    <div class="container">
    <button class="logout-btn" onclick="logOut()">Logout</button>
    <h2>FLOWAI Agentic Chatbot</h2>

    <div id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <div class="schedule-panel">
        <div class="schedule-header">
            <h3>Active Schedules</h3>
            <button class="small-btn" onclick="loadSchedules()">Refresh</button>
        </div>
        <div id="schedule-list" class="schedule-list">Loading schedules...</div>
    </div>
</div>


    <script>
        let conversation_id = "1";

        document.getElementById("message").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
        logOut = () => {
            window.location.href = "/logout";
        }

        async function sendMessage() {
            const messageInput = document.getElementById("message");
            const chatbox = document.getElementById("chatbox");

            const message = messageInput.value;

            if (!message) return;

            chatbox.innerHTML += `<div class="user">${message}</div>`;
            messageInput.value = "";

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    conversation_id: conversation_id,
                    message: message
                })
            });

            const data = await response.json();

            chatbox.innerHTML += `<div class="bot">${data.reply}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function loadSchedules() {
            const list = document.getElementById("schedule-list");
            list.innerHTML = "Loading schedules...";

            try {
                const response = await fetch("/schedules");
                const schedules = await response.json();

                if (!Array.isArray(schedules) || schedules.length === 0) {
                    list.innerHTML = "<div class='bot'>No active schedules.</div>";
                    return;
                }

                list.innerHTML = schedules.map(workflow => {
                    const nextRun = workflow.next_run ? new Date(workflow.next_run).toLocaleString() : "N/A";
                    const lastRun = workflow.last_run ? new Date(workflow.last_run).toLocaleString() : "Never";
                    const interval = workflow.interval_seconds ? `${workflow.interval_seconds} sec` : "N/A";

                    return `
                        <div class="schedule-item">
                            <p><strong>ID:</strong> ${workflow.id}</p>
                            <p><strong>Status:</strong> ${workflow.status}</p>
                            <p><strong>Next run:</strong> ${nextRun}</p>
                            <p><strong>Last run:</strong> ${lastRun}</p>
                            <p><strong>Interval:</strong> ${interval}</p>
                            <button onclick="cancelSchedule(${workflow.id})">Cancel schedule</button>
                        </div>
                    `;
                }).join("");
            } catch (error) {
                list.innerHTML = "<div class='bot'>Unable to load schedules.</div>";
                console.error(error);
            }
        }

        async function cancelSchedule(workflowId) {
            if (!confirm("Cancel this schedule?")) {
                return;
            }

            try {
                const response = await fetch(`/schedules/${workflowId}/cancel`, {
                    method: "POST"
                });
                const result = await response.json();

                if (result.status === "success") {
                    loadSchedules();
                } else {
                    alert(result.message || "Unable to cancel schedule.");
                }
            } catch (error) {
                alert("Cancel request failed.");
                console.error(error);
            }
        }

        document.addEventListener("DOMContentLoaded", loadSchedules);
    </script>

</body>
</html>
